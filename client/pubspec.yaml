name: walkie_talkie_client
description: Production-quality ephemeral team walkie-talkie and encrypted chat client built in Dart and Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Phoenix Channels client for Dart
  phoenix_socket: ^0.6.2
  # WebRTC for real-time peer-to-peer audio
  flutter_webrtc: ^0.10.6
  # State management
  provider: ^6.1.2
  # Cryptography for E2EE client-side message encryption (AES-GCM)
  cryptography: ^2.7.1
  # Audio recording & playback abstractions
  record: ^5.1.2
  audioplayers: ^6.0.0
  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
